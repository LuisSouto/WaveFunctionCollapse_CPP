name: Unit Tests CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        compiler: [gcc, clang]

    steps:
    - uses: actions/checkout@v4
    
    - name: Install dependencies
      run: |
        sudo apt-get update -qq
        export DEBIAN_FRONTEND=noninteractive
        sudo apt-get install -y --no-install-recommends -o Dpkg::Options::="--force-confdef" -o Dpkg::Options::="--force-confold" cmake build-essential || \
          (sleep 5 && sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends cmake build-essential)
        if [ "${{ matrix.compiler }}" = "clang" ]; then
          sudo apt-get install -y --no-install-recommends clang || \
            (sleep 5 && sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends clang)
        fi

    - name: Configure CMake
      run: |
        mkdir -p build
        cd build
        if [ "${{ matrix.compiler }}" = "clang" ]; then
          cmake -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DWFC_BUILD_TESTS=ON ..
        else
          cmake -DWFC_BUILD_TESTS=ON ..
        fi

    - name: Build
      run: |
        cd build
        make -j$(nproc)

    - name: Run tests
      run: |
        cd build
        ./bin/wfc_tests --gtest_output=xml:test_results.xml

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-${{ matrix.compiler }}
        path: build/test_results.xml

    - name: Publish test results
      if: always()
      uses: EnricoMi/publish-unit-test-result-action@v2
      with:
        files: build/test_results.xml
        check_name: Test Results (${{ matrix.compiler }})

  coverage:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install dependencies
      run: |
        sudo apt-get update -qq
        export DEBIAN_FRONTEND=noninteractive
        sudo apt-get install -y --no-install-recommends -o Dpkg::Options::="--force-confdef" -o Dpkg::Options::="--force-confold" cmake build-essential gcovr || \
          (sleep 5 && sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends cmake build-essential gcovr)

    - name: Configure CMake with coverage
      run: |
        mkdir -p build
        cd build
        cmake -DWFC_ENABLE_COVERAGE=ON -DWFC_BUILD_TESTS=ON ..

    - name: Build
      run: |
        cd build
        make -j$(nproc)

    - name: Run tests for coverage
      run: |
        cd build
        ./bin/wfc_tests

    - name: Generate coverage report
      run: |
        cd build
        gcovr --root .. --print-summary --html-details coverage.html --txt

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        files: ./build/coverage.txt
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: build/coverage.html
